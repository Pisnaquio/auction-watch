[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-watch"
version = "0.1.1"
description = "A generic, profile-driven auction monitor."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
auction-watch = "auction_watch.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auction_watch = [
  "py.typed",
  "migrations/env.py",
  "migrations/script.py.mako",
  "migrations/versions/*.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["auction_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
