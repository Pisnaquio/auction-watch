name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag, version files and CHANGELOG must agree
        run: python scripts/check_release_version.py --tag "$GITHUB_REF_NAME" --changelog
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Package and audit the add-on
        run: |
          python scripts/check_public_safety.py
          ./scripts/package_addon.sh "dist/auction-watch-addon-v$VERSION.tar.gz"
      - name: Release notes from CHANGELOG
        run: python scripts/check_release_version.py --print-notes > dist/notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Auction Watch $VERSION" \
            --notes-file dist/notes.md \
            "dist/auction-watch-addon-v$VERSION.tar.gz"

  # Optional: synchronous deploy from a self-hosted runner that can reach the
  # Home Assistant host over SSH (e.g. a Mac on the same LAN). Enable by
  # registering such a runner and setting the repository variable
  # AW_HA_DEPLOY=true. Without it, Supervisor's auto-update (or
  # scripts/ha_update.sh) applies the release instead.
  deploy-ha:
    if: vars.AW_HA_DEPLOY == 'true'
    needs: release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ha_update.sh "${GITHUB_REF_NAME#v}"
