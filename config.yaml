name: Auction Watch
version: "0.1.12"
slug: auctionwatch
description: Monitor público de subastas con perfiles independientes
startup: application
boot: auto
stage: experimental
init: false
arch:
  - amd64
  - aarch64
map:
  - type: data
    read_only: false
backup: cold
ingress: true
ingress_port: 8789
ingress_entry: /
ingress_stream: true
ingress_panel: true
panel_icon: mdi:gavel
panel_title: Auction Watch
panel_admin: false
watchdog: "http://[HOST]:[PORT:8789]/api/v1/health"
options:
  timezone: America/Montevideo
  scheduler_enabled: true
  worker_poll_seconds: 0.5
  smtp_enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_sender: auction-watch@localhost
  smtp_recipient: ""
  smtp_username: ""
  smtp_password: ""
  smtp_use_tls: true
schema:
  timezone: str
  scheduler_enabled: bool
  worker_poll_seconds: float
  smtp_enabled: bool
  smtp_host: str?
  smtp_port: int
  smtp_sender: str
  smtp_recipient: str?
  smtp_username: str?
  smtp_password: password?
  smtp_use_tls: bool
